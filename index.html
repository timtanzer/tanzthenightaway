<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tanzthenightaway</title>
  <meta name="description" content="Links to the Investing and Interview guide pages.">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7fb;
      color: #111827;
    }
    main {
      width: min(460px, 100%);
    }
    .links {
      display: grid;
      gap: 14px;
    }
    .link-card {
      display: block;
      padding: 20px 22px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: #ffffff;
      color: inherit;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(17, 24, 39, 0.06);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .link-card:hover {
      transform: translateY(-1px);
      border-color: #cfd5df;
      box-shadow: 0 16px 38px rgba(17, 24, 39, 0.10);
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #0f1115;
        color: #f3f4f6;
      }
      .link-card {
        background: #171a21;
        border-color: #2a2f3a;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
      }
      .link-card:hover {
        border-color: #3a4150;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
      }
    }
  </style>
</head>
<body>
  <main aria-label="Site links">
    <div class="links">
      <a class="link-card" href="investing">Investing</a>
      <a class="link-card" href="interview-guide">Interview guide</a>
    </div>
  </main>
</body>
</html>
